[package]
name = "bladepilot-device"
description = "Talks to cutting machines: transports (USB, virtual plotter) and the job protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bladepilot-machines = { workspace = true }
bladepilot-sim = { workspace = true }
craft-plotter = { workspace = true }
nusb = { workspace = true }
thiserror = { workspace = true }

# Windows: the machine sits behind the USB printer class driver (usbprint.sys).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
