name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Simulate the hardware test jobs
        run: |
          mkdir -p out
          cargo run -q -p bladepilot-cli --locked -- cut hardware-tests/T1-square.svg --pen --simulate out/T1.preview.svg
          cargo run -q -p bladepilot-cli --locked -- cut hardware-tests/T3-label.svg --simulate out/T3.preview.svg
          cargo run -q -p bladepilot-cli --locked -- cut hardware-tests/T4-two-colours.svg --by-color --pen-color "#ff0000" --simulate out/T4.preview.svg
