[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop/src-tauri"]
# The desktop app needs the system web view's development files (webkit2gtk on Linux); a plain
# `cargo build` leaves it out. Build it with `-p bladepilot-desktop` or `--workspace`.
default-members = ["crates/*", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Philipp Weber"]
repository = "https://github.com/TechnikWeber/BladePilot"

[workspace.dependencies]
# Building blocks from the Craft Apps (MIT OR Apache-2.0), pinned to one revision.
craft-plotter = { git = "https://github.com/storytold/craft-libs", rev = "d84096ce140d5da629cb968ffd58dd46ce194a8d" }
craft-silhouette-studio = { git = "https://github.com/storytold/craft-libs", rev = "d84096ce140d5da629cb968ffd58dd46ce194a8d" }

kurbo = "0.13"
usvg = "0.50"
nusb = "0.2"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-dialog = "2.8"
sys-locale = "0.3"

bladepilot-machines = { path = "crates/machines" }
bladepilot-design = { path = "crates/design" }
bladepilot-job = { path = "crates/job" }
bladepilot-sim = { path = "crates/sim" }
bladepilot-device = { path = "crates/device" }
bladepilot-capture = { path = "crates/capture" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
